<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Battleship</title>
    <link rel="stylesheet" href="battleship.css" />
  </head>
  <body>
    <div class="home-screen">
      <h1 class="home-title">BATTLESHIP</h1>
      <div class="home-buttons">
        <button class="play-friend home-btn">Player vs Player</button>
        <button class="play-computer home-btn">Player vs Computer</button>
      </div>
    </div>

    <div class="game-screen hidden">
      <button class="persistent-home-btn">🏠 Home</button>
      <div class="header">
        <p class="header-text">Battleship</p>
        <div class="user-alerts">
          <p class="turn-message"></p>
          <p class="hit-message"></p>
        </div>
      </div>
      <div id="gameboard-1"></div>
      <div id="gameboard-2"></div>
      <div class="bs-bank-1">
        <h3 class="bank-title">SHIPS:</h3>
      </div>
      <div class="bs-bank-2">
        <h3 class="bank-title">SHIPS:</h3>
      </div>
      <div class="footer"></div>
    </div>

    <!-- Confirmation Modal -->
    <div id="confirm-modal" class="modal hidden">
      <div class="modal-content">
        <h2>Return to Home?</h2>
        <p>Are you sure you want to go back to the home screen? Your current game will be lost.</p>
        <div class="modal-buttons">
          <button id="confirm-yes" class="modal-btn confirm-btn">Yes, Go Home</button>
          <button id="confirm-no" class="modal-btn cancel-btn">Cancel</button>
        </div>
      </div>
    </div>

    <script src="battleship.js"></script>
    <script src="gameUI.js"></script>
    <script src="battleshipAI.js"></script>
    <script src="game.js"></script>
  </body>
</html>
